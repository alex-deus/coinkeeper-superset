[tool.poetry]
name = "CoinKeeper"
package-mode = false
version = "0.1.0"
description = ""
license = "MIT"
authors = [ "Alex Deus" ]

[tool.poetry.dependencies]
python = "^3.11"
django = "^5.1.3"
gunicorn = "^21.2.0"
psycopg2-binary = "^2.9.9"
django-environ = "^0.11.2"
dj-database-url = "^2.1.0"
django-solo = "^2.2.0"
validators = "^0.22.0"
django-split-settings = "^1.2.0"
django-jsoneditor = "^0.2.4"
django-ipware = "^6.0.3"
django-admin-rangefilter = "^0.12.0"
django-essentials-kit = "^0.1.3"
django-admin-autocomplete-filter = "^0.7.1"
django-admin-csvexport = "^2.3"

[tool.poetry.group.dev.dependencies]
pre-commit = "^3.6.0"
isort = "^5.13.2"
seed-isort-config = "^2.2.0"
black = "^23.12.1"
flake8 = "^7.0.0"
autoflake = "^2.2.1"
bandit = "^1.7.6"
parameterized = "^0.9.0"
mock = "^5.1.0"
requests-mock = "^1.11.0"
django-dynamic-fixture = "^4.0.1"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.isort]
line_length = 120
multi_line_output = 3
include_trailing_comma = true
sections = ['FUTURE', 'STDLIB', 'THIRDPARTY', 'DJANGO', 'FIRSTPARTY', 'LOCALFOLDER']
known_django = ['django']
known_third_party = ["admin_auto_filters", "csvexport", "dj_database_url", "environ", "rangefilter", "split_settings", "validators"]

[tool.black]
line-length = 120
exclude = '''
/(
  \.git
  | tmp/
  | data/
)/
'''
